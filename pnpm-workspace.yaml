# spikes/ hold throwaway code with their own workspaces and lockfiles; they are not part of this one.
packages:
  - apps/*
  - packages/*

# Supply-chain guard: only install versions published at least 24 hours ago.
minimumReleaseAge: 1440

# Dependencies allowed to run install scripts. Everything else is blocked; a package that needs one
# is added here with a reason, and one that works without its script is listed as false.
allowBuilds:
  # Its install script only checks the platform binary, which the optional @esbuild/* package
  # already provides (used by Vitest through Vite).
  esbuild: false
  # Downloads the Electron binary for apps/restaurant (dev:electron and start). CI typechecks, tests
  # and builds without launching it and skips the download (ELECTRON_SKIP_BINARY_DOWNLOAD).
  electron: true
  # apps/whatsapp-gateway's Baileys: its preinstall only checks the Node version (engines already
  # says it), and protobufjs's postinstall only warns about its CLI's version; neither builds code.
  baileys: false
  protobufjs: false

# Advisories `pnpm audit --prod` (CI) accepts, each with no patched version and reachable only through
# build tools that Expo and React Native declare as runtime dependencies; none reaches an app bundle
# or a server. Remove an entry when a patched version ships.
auditConfig:
  ignoreGhsas:
    # node-forge signature verification: @expo/cli (developer and EAS machines, code signing of updates).
    - GHSA-86w9-cpqp-85rv
    # braces stack exhaustion on nested patterns: Metro's file map (bundling only; patterns are ours).
    - GHSA-vfj7-8cjw-p6xm
    # zod 3 memory exhaustion on oversized constrained collections: @expo/cli (developer and EAS
    # machines; the apps and servers use zod 4.6.7, patched). No patched zod 3.
    - GHSA-mrhx-c7xc-m3w5

# Patched versions of transitive dependencies whose parents still pin a vulnerable one. Remove an
# entry once the parent's own range picks up the patched version.
overrides:
  # @nestjs/platform-express 12.2.0 still pins multer 2.4.0 (GHSA-q7qp-rjg7-q26m).
  multer@2: 2.5.0
  # express 5's ^2.3.0, locked at a vulnerable 2.x (GHSA-27r3-jxmh-p828).
  body-parser@2: 2.4.0
