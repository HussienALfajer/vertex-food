name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # No check launches Electron: typecheck, tests, the build and E2E (in Playwright's Chromium) need
  # only its types.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  # Next.js sends no usage telemetry from CI.
  NEXT_TELEMETRY_DISABLED: '1'

# A new push to a pull request supersedes its running checks; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Turborepo's remote cache (docs/testing.md, "CI") is on once the repository has the TURBO_TOKEN and
# TURBO_REMOTE_CACHE_SIGNATURE_KEY secrets and the TURBO_TEAM variable (TURBO_API for a cache other
# than Vercel's). Only the jobs that run turbo get them. Until then, and for pull requests without
# secrets, each job keeps its own cache (actions/cache).
# Third-party actions are pinned to full commit SHAs (the tag in the comment); Dependabot proposes
# updates (.github/dependabot.yml). The gate job names are the checks main will require: renaming
# one means updating the branch protection too. Steps arrive with their first subject (.github/CLAUDE.md).
# E2E runs the built web front ends in Playwright's Chromium on three shards, inside Playwright's
# image, and uploads their RTL screenshots.
jobs:
  # Pull requests that change only Markdown skip the checks; the gate job below still reports, so
  # branch protection and auto-merge work.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE" HEAD)
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '\.md$'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Checks needed: $code"

  static:
    name: Lint, typecheck, build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API || 'https://vercel.com/api' }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turborepo's cache: tasks whose inputs did not change are replayed, not rerun. A pull request
      # reads its own runs' cache and main's; main cannot read a pull request's (GitHub keeps caches
      # per branch), so after a merge main runs what the pull request changed once more.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - name: No known high-severity advisory in production dependencies
        run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Migrations are generated from the Drizzle schema and never edited (ADR 0020): generating
      # again must change nothing. Generating reads only the schema and needs no database.
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/migrations
          test -z "$(git status --porcelain -- packages/db/migrations)"
      # The cache only grows (each run adds its new task results): start over past 1.5 GB.
      - name: Keep the Turborepo cache small
        if: always()
        run: |
          if [ -d .turbo/cache ] && [ "$(du -sm .turbo/cache | cut -f1)" -gt 1500 ]; then rm -rf .turbo/cache; fi

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway PostgreSQL 17 for the database tests; the passwords are fake and exist only for
    # this job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_ADMIN_URL: postgres://postgres:ci-only-admin-password@localhost:5432/postgres
      DATABASE_OWNER_URL: postgres://food_owner:ci-only-owner-password@localhost:5432/vertex_food
      DATABASE_APP_URL: postgres://food_app:ci-only-app-password@localhost:5432/vertex_food
      DATABASE_JOBS_URL: postgres://food_jobs:ci-only-jobs-password@localhost:5432/vertex_food
      DATABASE_QUEUE_URL: postgres://food_queue:ci-only-queue-password@localhost:5432/vertex_food
      DATABASE_SYNC_URL: postgres://food_sync:ci-only-sync-password@localhost:5432/vertex_food
      # The sync service's bucket storage and its scenario in apps/api (spec S04).
      POWERSYNC_STORAGE_URI: postgres://food_sync_storage:ci-only-storage-password@localhost:5432/vertex_food_powersync
      SYNC_SCENARIOS: '1'
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API || 'https://vercel.com/api' }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turborepo's cache: tasks whose inputs did not change are replayed, not rerun. A pull request
      # reads its own runs' cache and main's; main cannot read a pull request's (GitHub keeps caches
      # per branch), so after a merge main runs what the pull request changed once more.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      # The sync service replicates through logical decoding (packages/sync/CLAUDE.md); a service
      # container takes no server options, so the setting is made and the server restarted.
      - name: Logical replication for the sync service
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "ALTER SYSTEM SET wal_level = logical"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U postgres; do sleep 1; done
      - name: The sync service's pinned image
        run: docker pull journeyapps/powersync-service:1.27.0
      - name: Database roles and development database
        run: pnpm db:setup-local
      - name: Migrations apply to the development database
        run: pnpm db:migrate
      - run: pnpm test
      # The main process's database, hub and mutual TLS tests again in Electron's own Node: the
      # workflow skips Electron's binary, so this step downloads it.
      - name: Electron's binary
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ''
        run: node apps/restaurant/node_modules/electron/install.js
      - run: pnpm test:electron
      # The cache only grows (each run adds its new task results): start over past 1.5 GB.
      - name: Keep the Turborepo cache small
        if: always()
        run: |
          if [ -d .turbo/cache ] && [ "$(du -sm .turbo/cache | cut -f1)" -gt 1500 ]; then rm -rf .turbo/cache; fi

  # Every app's suite split over three runners by test (Playwright --shard; the configs set
  # fullyParallel). Each shard builds what it tests, or replays the build from its cache.
  e2e:
    name: E2E shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's own image (pinned by digest, the tag in the comment) holds Chromium and its system
    # packages: installing them on each shard took up to 11 minutes whenever the Ubuntu mirrors were
    # slow. Its version is the apps' @playwright/test, which a step below checks.
    container:
      image: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea # v1.64.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # Where the image keeps its browsers; turbo.json passes it through to Playwright (its strict
      # environment mode hides every variable a task does not list).
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API || 'https://vercel.com/api' }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turborepo's cache, as in the jobs above; each shard keeps its own. A shard whose apps did
      # not change replays its E2E results (turbo.json: test:e2e is cached, with test-results/).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-${{ matrix.shard }}-
      - name: Playwright matches the container image
        run: |
          version=$(pnpm --silent --filter @vertex-food/web exec playwright --version)
          if [ "$version" != "Version 1.64.1" ]; then
            echo "::error::@playwright/test is at $version but the container image is v1.64.1: move the image (tag and digest) and this check together"
            exit 1
          fi
      # Builds what each front end needs (turbo.json: test:e2e depends on build), then runs this
      # shard of the restaurant renderer, the console, the web app and the customer and driver web
      # exports, light and dark.
      - run: pnpm turbo run test:e2e -- --shard=${{ matrix.shard }}/3
      - name: E2E screenshots and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: apps/*/test-results/
          if-no-files-found: ignore
          retention-days: 14
      # The cache only grows (each run adds its new task results): start over past 1.5 GB.
      - name: Keep the Turborepo cache small
        if: always()
        run: |
          if [ -d .turbo/cache ] && [ "$(du -sm .turbo/cache | cut -f1)" -gt 1500 ]; then rm -rf .turbo/cache; fi

  # The check branch protection will require: it passes when every job behind it passed or was
  # skipped (documentation only), and fails otherwise.
  checks:
    name: Typecheck, lint, test, build
    needs: [changes, static, test, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          ! echo "$NEEDS" | grep -qE '"result": "(failure|cancelled)"'

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
